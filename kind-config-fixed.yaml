kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-cluster

nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 80
  - containerPort: 30443
    hostPort: 443
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        controllerManager:
          extraArgs:
            node-monitor-grace-period: "30s"
        kubelet:
          extraArgs:
            cgroup-driver: "cgroupfs"
    extraMounts:
      - hostPath: /sys/fs/cgroup
        containerPath: /sys/fs/cgroup
        readOnly: false